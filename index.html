<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>MiniShop</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <h1>Xin chào MiniShop</h1> 
        <header class="header">
            <div class="logo">
                <a href="#"><img src="img/logo.jpg" alt="shopLogo" width="50%"></a>
            </div>
            <nav class="menu">
                <ul>
                    <li><a href="#">Trang chủ</li></a>
                    <li><a href="pages/about.html">Giới thiệu</li></a>
                    <li><a href="pages/products.html">Sản phẩm</li></a>
                    <li><a href="pages/buy.html">Mua hàng</li></a>
                </ul>
            </nav>
        </header>
        <div class="sanPham">
            <article class="chuot">
                <img src="img/chuot.jpg" alt="Chuột">
                <h3>Chuột Logitech</h3>
                <p class="price">199.000đ</p>
                <button>Thêm vào giỏ</button>
            </article>
            <article class="lotChuot">
                <img src="img/lotChuot.jpg" alt="Lót chuột">
                <h3>Lót chuột Razer</h3>
                <p class="price">300.000đ</p>
                <button>Thêm vào giỏ</button>
            </article>
            <article class="phim">
                <img src="img/manHinh.jpg" alt="Màn hình">
                <h3>Màn hình Xiaomi</h3>
                <p class="price">150.000đ</p>
                <button>Thêm vào giỏ</button>
            </article>
            <article class="man">
                <img src="img/phim.jpg" alt="Bàn phím">
                <h3>Bàn phím Rapoo</h3>
                <p class="price">180.000đ</p>
                <button>Thêm vào giỏ</button>
            </article>
            <article class="taiNghe">
                <img src="img/taiNghe.jpg" alt="Tai nghe">
                <h3>Tai nghe Logitech</h3>
                <p class="price">180.000đ</p>
                <button>Thêm vào giỏ</button>
            </article>
        </div>
        <script src="js/app.js"></script>
    </body>
</html>
